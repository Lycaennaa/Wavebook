name: Wavebook
minimumXcodeGenVersion: 2.46.0

options:
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "15.0"

configs:
  Debug: debug
  Release: release

fileGroups:
  - Configuration

settings:
  base:
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SDKROOT: auto
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: "YES"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: "NO"
      MTL_ENABLE_DEBUG_INFO: "NO"
      SWIFT_COMPILATION_MODE: wholemodule


      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1

targets:
  Wavebook:
    type: application
    platform: macOS
    sources:
      - path: Wavebook/App
        excludes:
          - Assets.xcassets
      - path: Wavebook/App/Assets.xcassets
        buildPhase: resources
      - path: OnboardingCopy.json
        buildPhase: resources
    configFiles:
      Debug: Configuration/PublicIdentity.xcconfig
      Release: Configuration/PublicIdentity.xcconfig
    dependencies:
      - target: WavebookCore
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_PREVIEWS: "YES"
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Wavebook
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: "$(APP_PRODUCT_NAME)"
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "NO"

  WavebookCore:
    type: framework
    platform: macOS
    sources:
      - path: Wavebook/Sources/WavebookCore
    configFiles:
      Debug: Configuration/PublicIdentity.xcconfig
      Release: Configuration/PublicIdentity.xcconfig
    dependencies:
      - package: GRDB.swift
        product: GRDB
      - sdk: libsqlite3.tbd
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: "YES"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_CORE_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: macosx
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "NO"

  WavebookPerformance:
    type: tool
    platform: macOS
    sources:
      - path: Wavebook/Performance
      - path: Wavebook/App
        excludes:
          - main.swift
          - Assets.xcassets
    dependencies:
      - target: WavebookCore
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SUPPORTED_PLATFORMS: macosx
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  WavebookCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Wavebook/Tests/WavebookCoreTests
        excludes:
          - Fixtures
      - path: Wavebook/App/MainViewController/InitialLibraryScanShuffleRequest.swift
      - path: Wavebook/App/Navigation/PlaylistPageAccumulator.swift
      - path: Wavebook/App/Catalog/CatalogShuffleCoordinator.swift
      - path: Wavebook/App/Navigation/PlaylistPlaybackSelection.swift
      - path: Wavebook/App/Playback/PlaybackQueueCoordinator.swift
      - path: Wavebook/App/Playback/PlaybackPresentationState.swift
      - path: Wavebook/App/Notifications/OperationalErrorKind.swift
      - path: Wavebook/App/Library/LibraryScanCoordinator.swift
      - path: Wavebook/App/Onboarding/OnboardingLaunchPolicy.swift
      - path: Wavebook/App/Onboarding/OnboardingCopy.swift
      - path: OnboardingCopy.json
        buildPhase: resources
      - path: Wavebook/App/SongList/SongListPaginationPolicy.swift
      - path: Wavebook/App/StatisticsHeatmapView.swift
      - path: Wavebook/App/AppTheme.swift
      - path: Wavebook/App/AppAppearance.swift
      - path: Wavebook/App/ThemeAwareViews.swift
      - path: Wavebook/App/Window/RootSplitView.swift
      - path: Wavebook/App/SongList/SongListViewController.swift
      - path: Wavebook/App/SongList/SongListActions.swift
      - path: Wavebook/App/SongList/SongItem.swift
      - path: Wavebook/App/SongList/SongListContextMenu.swift
      - path: Wavebook/App/Catalog/BrowseListViewController.swift
      - path: Wavebook/App/FacetTracks/ArtistCollectionItems.swift
      - path: Wavebook/App/FacetTracks/ArtistContentListView.swift
      - path: Wavebook/App/Artwork
      - path: Wavebook/App/Catalog/SongsPageViewController.swift
      - path: Wavebook/App/Navigation/CatalogNavigationHost.swift
      - path: Wavebook/App/Navigation/LibraryPage.swift
      - path: Wavebook/Tests/WavebookCoreTests/Fixtures
        buildPhase: resources
    configFiles:
      Debug: Configuration/PublicTestIdentity.xcconfig
      Release: Configuration/PublicTestIdentity.xcconfig
    dependencies:
      - target: WavebookCore
    settings:
      base:
        BUNDLE_LOADER: ""
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_TEST_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SUPPORTED_PLATFORMS: macosx
        TEST_HOST: ""
      configs:
        Release:
          CODE_SIGNING_ALLOWED: "NO"

schemes:
  WavebookPerformance:
    shared: true
    build:
      targets:
        WavebookPerformance: all
    run:
      config: Release
    profile:
      config: Release

  Wavebook:
    shared: true
    build:
      targets:
        Wavebook: all
        WavebookCoreTests: [test, analyze]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: WavebookCoreTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  WavebookTests:
    shared: true
    build:
      targets:
        Wavebook: all
        WavebookCoreTests: [test, analyze]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: WavebookCoreTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release