name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavebook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ vars.BLACKSMITH_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    env:
      WAVEBOOK_DEVELOPER_DIR: ${{ vars.WAVEBOOK_DEVELOPER_DIR }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and report toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          if [ -n "${WAVEBOOK_DEVELOPER_DIR:-}" ]; then
            export DEVELOPER_DIR="$WAVEBOOK_DEVELOPER_DIR"
            printf 'DEVELOPER_DIR=%s\n' "$WAVEBOOK_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcode-select --print-path
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          XCODE_VERSION="$xcode_version" python3 - <<'PY'
          import os
          import re

          version = os.environ["XCODE_VERSION"].splitlines()[0].split()[1]
          components = tuple(int(part) for part in re.findall(r"\d+", version))
          if components[:2] < (16, 4):
              raise SystemExit(f"Xcode 16.4 or later required; found {version}")
          PY
          swift --version
          python3 --version

      - name: Generate and verify Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate --spec project.yml
          git diff --exit-code -- Wavebook.xcodeproj

      - name: Validate repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/package-release.sh scripts/install-hooks.sh
          python3 -B scripts/check-pbx-identifiers.py
          python3 -B scripts/check-package-locks.py

      - name: Run SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
          fi
          swiftlint lint --config .swiftlint.yml

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Wavebook.xcodeproj \
            -scheme WavebookTests \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/wavebook-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            test

      - name: Build Release configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Wavebook.xcodeproj \
            -scheme Wavebook \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/wavebook-release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SDKROOT=auto \
            build
